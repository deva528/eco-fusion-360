<!DOCTYPE html>
<html>
<head>
    <title>User Login - Eco Fusion 360</title>

    <style>
        body {
            font-family: Arial;
            background: #071a12;
            color: white;
            text-align: center;
            padding: 70px;
        }

        .box {
            max-width: 420px;
            margin: auto;
            background: #103c27;
            padding: 35px;
            border-radius: 18px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #42e879;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff7777;
        }

        a {
            color: #66ff99;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>👤 User Login</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New user?
        <a href="{{ url_for('register') }}">
            Create Account
        </a>
    </p>

    <p>
        <a href="{{ url_for('home') }}">
            ← Home
        </a>
    </p>

</div>

</body>
</html>
