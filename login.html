<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Eco Fusion 360</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #061b11, #0c3520);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 430px;
    background: rgba(255,255,255,0.08);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #72ff9f;
}

.subtitle {
    text-align: center;
    color: #c5e7cf;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 10px;
    background: #19a852;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #27c967;
}

.error {
    background: #7e2020;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.bottom {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #72ff9f;
}

</style>

</head>

<body>

<div class="container">

    <h1>🔐 Eco Fusion 360</h1>

    <p class="subtitle">
        Login to your account
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🚀 Login
        </button>

    </form>

    <div class="bottom">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </div>

</div>

</body>
</html>
