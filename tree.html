<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eco Fusion 360 - Tree Garden</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #65b9ef 0%,
            #bce8ff 55%,
            #7acb65 56%,
            #3c9138 100%
        );

    height: 100vh;
}

/* SKY */

.sun {
    position: absolute;
    width: 110px;
    height: 110px;

    right: 90px;
    top: 55px;

    border-radius: 50%;

    background: #fff29a;

    box-shadow:
        0 0 35px #fff3a8,
        0 0 80px rgba(255,240,120,0.6);
}

/* CLOUDS */

.cloud {
    position: absolute;

    width: 180px;
    height: 55px;

    background: white;

    border-radius: 50px;

    opacity: 0.85;

    animation: moveCloud 35s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: white;

    border-radius: 50%;
}

.cloud::before {
    width: 70px;
    height: 70px;

    left: 30px;
    top: -35px;
}

.cloud::after {
    width: 90px;
    height: 90px;

    right: 25px;
    top: -45px;
}

.cloud1 {
    top: 90px;
    left: -220px;
}

.cloud2 {
    top: 190px;
    left: -400px;

    transform: scale(0.7);

    animation-delay: 10s;
}

@keyframes moveCloud {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(140vw);
    }

}

/* MOUNTAINS */

.mountains {
    position: absolute;

    bottom: 35%;

    width: 100%;
    height: 250px;

    background:
        linear-gradient(
            135deg,
            transparent 35%,
            #4d8170 36%,
            #416e60 58%,
            transparent 59%
        ),
        linear-gradient(
            45deg,
            transparent 35%,
            #608f7c 36%,
            #4d7d6b 58%,
            transparent 59%
        );

    opacity: 0.8;
}

/* GROUND */

.ground {
    position: absolute;

    bottom: 0;

    width: 100%;
    height: 37%;

    background:
        radial-gradient(
            circle at 20% 30%,
            #78c965 0 3px,
            transparent 4px
        ),
        radial-gradient(
            circle at 60% 60%,
            #65b858 0 3px,
            transparent 4px
        ),
        linear-gradient(
            #55aa4c,
            #2f7832
        );
}

/* RIVER */

.river {
    position: absolute;

    bottom: 0;
    right: 12%;

    width: 190px;
    height: 42%;

    background:
        linear-gradient(
            90deg,
            #39aee7,
            #82ddff,
            #3baee8
        );

    border-radius: 50% 50% 0 0;

    transform: rotate(8deg);

    opacity: 0.9;
}

/* GAME PANEL */

.panel {
    position: absolute;

    top: 25px;
    left: 25px;

    width: 290px;

    padding: 22px;

    background: rgba(5,35,20,0.88);

    color: white;

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);

    z-index: 20;
}

.panel h1 {
    margin: 0 0 5px;

    color: #7cff92;

    font-size: 25px;
}

.panel p {
    color: #d5f7dc;
}

.tokens {
    font-size: 20px;

    color: #ffe46b;

    margin: 15px 0;
}

/* TREE */

.tree-area {
    position: absolute;

    bottom: 28%;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 10;
}

/* TREE TRUNK */

.trunk {
    width: 55px;

    height: 170px;

    background:
        linear-gradient(
            90deg,
            #6b381c,
            #9b582b,
            #613117
        );

    border-radius: 20px 20px 8px 8px;

    transition: 1s;
}

/* LEAVES */

.leaves {
    width: 260px;

    height: 230px;

    margin-bottom: -30px;

    position: relative;
}

.leaf {
    position: absolute;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8eff7c,
            #16843c 65%,
            #075b29
        );

    border-radius: 50%;

    box-shadow:
        inset -10px -12px 20px rgba(0,0,0,0.18);
}

.leaf1 {
    width: 145px;
    height: 145px;

    left: 55px;
    top: 0;
}

.leaf2 {
    width: 125px;
    height: 125px;

    left: 0;
    top: 75px;
}

.leaf3 {
    width: 130px;
    height: 130px;

    right: 0;
    top: 70px;
}

/* WATER BUTTON */

.water-button {
    margin-top: 15px;

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #28c9ff;

    color: #062c3b;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.water-button:hover {
    background: #64ddff;
}

/* RESET */

.reset-button {
    margin-top: 10px;

    width: 100%;

    padding: 11px;

    border: 1px solid #8cffaa;

    background: transparent;

    color: #8cffaa;

    border-radius: 10px;

    cursor: pointer;
}

/* GROWTH BAR */

.progress {
    width: 100%;

    height: 14px;

    background: #244632;

    border-radius: 10px;

    overflow: hidden;

    margin-top: 8px;
}

.progress-fill {
    height: 100%;

    width: 0%;

    background: #63ef7b;

    transition: 0.5s;
}

/* WATER DROPS */

.drop {
    position: absolute;

    font-size: 28px;

    animation: dropDown 1s linear forwards;

    z-index: 30;
}

@keyframes dropDown {

    from {
        top: 25%;
        opacity: 1;
    }

    to {
        top: 63%;
        opacity: 0;
    }

}

/* RESPONSIVE */

@media(max-width:700px) {

    .panel {
        width: 230px;
        padding: 15px;
    }

    .panel h1 {
        font-size: 20px;
    }

    .tree-area {
        transform:
            translateX(-50%)
            scale(0.75);
    }

    .sun {
        width: 70px;
        height: 70px;

        right: 30px;
        top: 30px;
    }

}

</style>
</head>

<body>

<!-- SUN -->

<div class="sun"></div>

<!-- CLOUDS -->

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- MOUNTAINS -->

<div class="mountains"></div>

<!-- RIVER -->

<div class="river"></div>

<!-- GROUND -->

<div class="ground"></div>


<!-- TREE -->

<div class="tree-area">

    <div class="leaves">

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>

    </div>

    <div
        class="trunk"
        id="trunk">
    </div>

</div>


<!-- GAME PANEL -->

<div class="panel">

    <h1>
        🌱 PIXEL TREE GARDEN
    </h1>

    <p>
        Grow your tree by giving it water.
    </p>

    <div class="tokens">
        🟢 Green Tokens:
        <span id="tokens">500</span>
    </div>

    <div>
        Growth:
        <span id="growthText">0%</span>
    </div>

    <div class="progress">

        <div
            class="progress-fill"
            id="progress">
        </div>

    </div>

    <button
        class="water-button"
        onclick="waterTree()">

        💧 Water Tree
        (-25 Tokens)

    </button>

    <button
        class="reset-button"
        onclick="resetTree()">

        🔄 Reset Tree

    </button>

</div>


<script>

let tokens = 500;

let growth = 0;

const maxGrowth = 100;


function waterTree() {

    if (tokens < 25) {

        alert("You don't have enough Green Tokens!");

        return;

    }


    if (growth >= maxGrowth) {

        alert("🌳 Your tree has fully grown!");

        return;

    }


    tokens -= 25;

    growth += 5;


    if (growth > maxGrowth) {

        growth = maxGrowth;

    }


    updateGame();

    createWaterDrop();

}


function updateGame() {

    document.getElementById("tokens").textContent =
        tokens;

    document.getElementById("growthText").textContent =
        growth + "%";

    document.getElementById("progress").style.width =
        growth + "%";


    /*
        Tree becomes larger as it grows.
    */

    let scale = 1 + (growth / 100) * 0.9;

    document.getElementById("trunk").style.transform =
        "scaleY(" + scale + ")";

    document.querySelector(".leaves").style.transform =
        "scale(" + scale + ")";


    if (growth >= 100) {

        document.querySelector(".panel h1").textContent =
            "🌳 TREE FULLY GROWN!";

    }

}


function resetTree() {

    tokens = 500;

    growth = 0;

    document.querySelector(".panel h1").textContent =
        "🌱 PIXEL TREE GARDEN";

    updateGame();

}


function createWaterDrop() {

    const drop =
        document.createElement("div");

    drop.className = "drop";

    drop.textContent = "💧";

    drop.style.left =
        (48 + Math.random() * 5) + "%";

    document.body.appendChild(drop);


    setTimeout(function() {

        drop.remove();

    }, 1000);

}


updateGame();

</script>

</body>
</html>
